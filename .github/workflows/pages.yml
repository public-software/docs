name: pages
# https://publicsoftware.dev is built here, by GitHub Pages, from this repository and the catalog: on every push to main, by hand,
# and nightly — what each page says has shipped comes from every repository's own CATALOG.toml, read when the site
# is built (site/build.py), so a first crate merged anywhere shows on its page within a day with no other action.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"   # nightly, 04:17 UTC
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  MDBOOK_VERSION: 0.5.4
  MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7   # mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: The catalog this site is built from (site/catalog.lock)
        id: lock
        run: echo "ref=$(sed -n 's/^ref *= *"\([^"]*\)".*/\1/p' site/catalog.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: public-software/catalog
          ref: ${{ steps.lock.outputs.ref }}
          path: catalog
          persist-credentials: false
      - name: Install mdBook
        run: |
          curl -sSL -o mdbook.tar.gz "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${MDBOOK_SHA256}  mdbook.tar.gz" | sha256sum -c -
          tar xzf mdbook.tar.gz
      - name: Build the site (every repository's CATALOG.toml is read through gh)
        env: { GH_TOKEN: ${{ github.token }} }
        run: python3 site/build.py build --catalog-dir catalog/catalog --out target/site
      - name: Build the handbook
        run: ./mdbook build target/site/handbook -d "$PWD/target/site/www/handbook"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: target/site/www }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
