name: pages
# https://publicsoftware.dev is built here, by GitHub Pages, from this repository and the catalog: on every push to main, by hand,
# and nightly — what each page says has shipped comes from every repository's own CATALOG.toml, read when the site
# is built (site/build.py), so a first crate merged anywhere shows on its page within a day with no other action.
# The run also records the day: the `history` job keeps one state.json per day under history/ on the `state` branch
# of this repository (the rulesets guard main only, so the workflow token can push there), and the landing page's
# burn-up is drawn from that record. Deleting the branch only loses the chart.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"   # nightly, 04:17 UTC
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
env:
  MDBOOK_VERSION: 0.5.4
  MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7   # mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: The catalog this site is built from (site/catalog.lock)
        id: lock
        run: echo "ref=$(sed -n 's/^ref *= *"\([^"]*\)".*/\1/p' site/catalog.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: public-software/catalog
          ref: ${{ steps.lock.outputs.ref }}
          path: catalog
          persist-credentials: false
      - name: The recorded days (the state branch; empty until the first run has recorded one)
        env:
          REPO: ${{ github.repository }}
        run: git clone -q --depth 1 --branch state "https://github.com/${REPO}.git" state || { echo "::notice::no state branch yet, history starts today"; mkdir -p state/history; }
      - name: Install mdBook
        run: |
          curl -sSL -o mdbook.tar.gz "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${MDBOOK_SHA256}  mdbook.tar.gz" | sha256sum -c -
          tar xzf mdbook.tar.gz
      - name: Build the site (every repository's CATALOG.toml is read through gh)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 site/build.py build --catalog-dir catalog/catalog --history state/history --out target/site
      # the handbook folds in every repository's docs/ (its book, its decision records): a shallow checkout of each
      # repository the catalog lists, then this repository's own crate assembles the tree and checks every link
      - name: Every repository the catalog lists, shallow (public repositories, no token)
        env:
          ORG: public-software
        run: |
          set -euo pipefail
          mkdir -p checkouts
          python3 -c 'import sys, tomllib; print("\n".join(r["name"] for r in tomllib.load(open(sys.argv[1], "rb"))["repo"]))' catalog/catalog/catalog.toml \
            | xargs -P 8 -I{} git clone -q --depth 1 "https://github.com/${ORG}/{}.git" "checkouts/{}"
      - run: rustup update --no-self-update stable && rustup default stable   # the runner ships rustup
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build docs-aggregate, this repository's own crate
        run: cargo build --release --locked -p pub-docs-aggregate
      - name: Fold every repository's docs/ and decision records into the handbook (a dangling link fails here, named)
        run: target/release/docs-aggregate --catalog catalog/catalog/catalog.toml --repos checkouts --handbook target/site/handbook --out target/site/handbook-full
      - name: Build the handbook
        run: ./mdbook build target/site/handbook-full -d "$PWD/target/site/www/handbook"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/site/www
          include-hidden-files: true   # .well-known/ (security.txt, the wasm-pkg registry) is excluded by default
      - name: Today's state.json, for the history job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: state
          path: target/site/www/state.json
          retention-days: 1
  history:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the one write in this workflow: a push to the state branch, which no ruleset guards
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: state
          path: today
      - name: Record the day on the state branch, once (history/<as_of>.json)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          day="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["as_of"])' today/state.json)"
          gh auth setup-git
          git init -q state && cd state
          git remote add origin "https://github.com/${REPO}.git"
          if git fetch -q --depth 1 origin state; then
            git checkout -q -b state FETCH_HEAD
          else
            git checkout -q --orphan state
            printf '# state\n\nThe record the site draws its history from: one `state.json` per day under `history/`, written by the pages workflow of this repository. Deleting this branch only loses the chart.\n' > README.md
          fi
          if [ -e "history/$day.json" ]; then echo "history/$day.json is already recorded"; exit 0; fi
          mkdir -p history && cp ../today/state.json "history/$day.json"
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "state: $day" && git push -q origin state
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
